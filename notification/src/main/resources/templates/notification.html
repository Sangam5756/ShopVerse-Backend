<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #28a745;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            background-color: #f9f9f9;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 0 0 5px 5px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 12px;
        }
        .notification-box {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            border-left: 4px solid #28a745;
        }
        .timestamp {
            color: #666;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${eventType}">Notification</h1>
    </div>
    
    <div class="content">
        <p th:text="'Hello ' + ${customerName} + ','">Hello User,</p>
        
        <div class="notification-box">
            <p th:text="${message}">You have a new notification.</p>
            <div class="timestamp">
                <strong>Date:</strong> <span th:text="${timestamp}">2024-01-01 12:00:00</span>
            </div>
        </div>
        
        <p>Please check your account for more details.</p>
        
        <p>Best regards,<br>ShopVerse Team</p>
    </div>
    
    <div class="footer">
        <p>&copy; 2024 ShopVerse. All rights reserved.</p>
        <p>This is an automated message. Please do not reply to this email.</p>
    </div>
</body>
</html>
