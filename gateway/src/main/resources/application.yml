server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - path=/api/products/**

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - path=/api/categories/**
  security:
    user:
      name: disabled
      password: disabled

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

