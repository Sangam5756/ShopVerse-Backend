scrape_configs:
  - job_name: "shopverse-services"
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets:
          - host.docker.internal:8080 # gateway
          - host.docker.internal:8081 # auth
          - host.docker.internal:8082 # user
          - host.docker.internal:8083 # product
          - host.docker.internal:8084 # order
          - host.docker.internal:8085 # payment
          - host.docker.internal:8086 # notification
          - host.docker.internal:8087 # analytics
          - host.docker.internal:8088 # recommendation

  - job_name: "docker"
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: "kafka"
    static_configs:
      - targets:
          - kafka-exporter:9308
