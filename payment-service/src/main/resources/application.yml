server:
  port: 8085

spring:
  application:
    name: PAYMENT-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/shopverse_payment?createDatabaseIfNotExist=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true


eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      DefaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true


springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    enabled: true