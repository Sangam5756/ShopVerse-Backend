server:
  port: 8088

spring:
  application:
    name: recommendation-service

  kafka:
    bootstrap-servers: localhost:9092

  mongodb:
    uri: mongodb://localhost:27017/recommendations

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
