server:
  port: 8079  # Different port from your other services

spring:
  application:
    name: admin-server
  boot:
    admin:
      ui:
        title: ShopVerse Admin
      discovery:
        enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true