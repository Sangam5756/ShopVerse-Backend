spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
    config:
      uri: ${CONFIG_SERVER_URI:http://localhost:8888}
      fail-fast: true
      retry:
        initial-interval: 1000
        max-interval: 2000
        max-attempts: 6
        multiplier: 1.1
    discovery:
      client:
        simple:
          instances:
            config-server:
              - uri: ${CONFIG_SERVER_URI:http://localhost:8888}
            discovery-service:
              - uri: ${EUREKA_SERVER_URI:http://localhost:8761}

# Eureka Client Configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URI:http://localhost:8761}/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes,refresh,metrics
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true